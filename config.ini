Background:
Users ask natural-language questions about product attributes contained in two local JSON datasheets (e.g., “What is the width of 6205?”, “Height of 6205 N?”).
This mini app uses two agents plus a lightweight orchestrator, built with Microsoft Semantic Kernel (C#). Agents rely on function calling to access data, caching, and feedback storage.
No UI should be provided—expose a single HTTP endpoint only.
Conversational state must be preserved between interactions.
High-Level Flow:
User sends a message to the HTTP endpoint.
Orchestrator classifies intent (question vs. feedback) and routes to the correct agent.
The selected agent uses function calling to consult cache, read datasheets, or store feedback.
The system returns a concise, grounded response.
State from prior turns is reused for follow-ups and feedback linkage.
Agents (High Level):
Q&A Agent (Answer Questions)
Uses Semantic Kernel with Azure OpenAI to extract the product designation and requested attribute.
Answers only from validated datasheet content (two local JSON files); abstains if not found.
Leverages function calling for cache reads/writes and datasheet access.
Responds concisely (e.g., “The width of the 6205 bearing is 15 mm.”).
Feedback Agent (Capture Feedback)
Detects feedback (corrections, helpful/unhelpful, notes).
Normalizes any referenced product/attribute when present; otherwise uses recent conversation state.
Uses function calling to persist feedback (e.g., Redis) and confirms receipt.
Orchestrator (Recommended):
Routes each message to Q&A or Feedback via Semantic Kernel + Azure OpenAI classification.
Passes minimal context (last answer, extracted designation/attribute) to support follow-ups and feedback.
High-Level Requirements:
Technology: C#, Microsoft Semantic Kernel, Azure OpenAI.
Endpoint: Single Azure Function (HTTP). No UI.
Product & Attribute Identification: Use function calling via Semantic Kernel to extract designation and attribute.
Datasheet Lookup: Read from local JSON files for authoritative values.
Answer Generation: Return concise, grounded answers; if unknown, say so.
Caching (nice-to-have): In-memory or Redis to speed repeated queries.
Feedback Capture: Persist user feedback via function calling (e.g., Redis).
Hallucination Controls: Never invent values; answer only with data found in JSON or abstain.
Security & Config: Keys/URLs via env vars or config; minimal logging; input validation.
Conversation Support: Maintain state across turns to link feedback to prior Q&A and handle follow-ups.
AI-Assisted Validation: Use AI (e.g., Semantic Kernel/Azure OpenAI, Copilot) to review the design and code against best practices (clean architecture, SOLID, error handling, testability), security baselines (e.g., OWASP-style input handling), cloud/config patterns, and maintainability. Capture the rationale briefly.
Deliverables:
C# Azure Function (HTTP) implementing:
SK-based Orchestrator for intent routing.
Q&A Agent and Feedback Agent using Semantic Kernel + Azure OpenAI with function calling.
Code that reads from local JSON datasheets; optional Redis cache and feedback store.
Brief README describing:
How to run/test.
Required environment variables (Azure OpenAI, Redis, feature flags like USE_REDIS).
Notes on caching, hallucination reduction, and conversational state.
AI Validation Notes: a short summary (bulleted) of AI feedback you applied—covering architecture, security, clean code, and patterns.
Example Interactions:
Q: “What is the width of 6205?”
A: “The width of the 6205 bearing is 15 mm.”
Follow-up using state: “And what about its diameter?”
A: “The diameter of the 6205 bearing is … mm.”
Feedback: “That last width is wrong—store my correction: 6205 width 15 mm.”
A: “Thanks—your feedback for 6205 / width has been saved.”
Not Found: “Diameter for 9999?”
A: “Sorry, I can’t find that information for ‘9999’. Please try another designation or attribute.”
Evaluation Criteria:
Architecture & Clarity: Clear separation of orchestrator, agents, and function calls.
Semantic Kernel Usage: Appropriate routing, prompting, and function calling.
Correctness: Accurate extraction and lookups strictly from the JSON datasheets.
Statefulness: Robust conversational state across turns.
Caching: Effective if implemented (in-memory/Redis).
Graceful Handling: Clear responses when data is missing; no fabricated values.
Security & Config: Keys via env/config; minimal logging; prompt hardening.
AI-Assisted Validation: Evidence of AI review and applied improvements (clean code, patterns, security).
