Alert Triage Agent Core Architecture
Overview
The Alert Triage Agent is an AI-powered system built on Microsoft Semantic Kernel that automates the disposition of fraud alerts by learning from historical decisions and applying business rules. It acts as an intelligent assistant that can recommend or automatically apply dispositions to incoming alerts.

Core Components
1. Agent Orchestrator
The central coordinator that:

Receives incoming alerts from the FCM Alert System
Manages the overall triage workflow
Coordinates between Semantic Kernel components and Redis
Handles concurrent alert processing
Maintains agent lifecycle (start, pause, stop)
2. Semantic Kernel Components
Planner (Sequential/Action)
Breaks down complex triage tasks into steps
Decides which plugins/skills to invoke in sequence
Can use Sequential Planner for multi-step reasoning or Action Planner for single-step decisions
Example: "Analyze alert → Find similar cases → Apply rules → Recommend disposition"
LLM Connector (Azure OpenAI/OpenAI)
Interfaces with large language models (GPT-4, etc.)
Generates natural language reasoning for decisions
Processes unstructured alert data (notes, descriptions)
Enables semantic understanding of alert context
Plugins/Skills
Custom-built capabilities for FCM domain:

Alert Analysis Plugin: Extracts key features from alerts (amount, type, customer risk)
Disposition Logic Plugin: Applies business logic for disposition recommendations
Rule Evaluation Plugin: Validates against compliance and business rules
Watchlist Check Plugin: Interfaces with Lucene search service
Context Manager
Maintains conversation/session state during alert processing
Tracks the reasoning chain for each alert
Stores intermediate results between plugin calls
Backed by Redis session store
Prompt Templates
Pre-designed prompts for consistent AI behavior:

Embeddings Generator
Converts alert data into vector representations (embeddings)
Enables semantic similarity search
Compares new alerts to historical patterns
Uses models like text-embedding-ada-002
3. Decision Engine
Similarity Matcher
Performs vector-based similarity search using Redis
Finds alerts with similar characteristics from history
Calculates semantic similarity scores
Returns top-N similar cases with their outcomes
Rule Engine
Evaluates business criteria (amount thresholds, account age, transaction patterns)
Applies regulatory compliance rules
Integrates with FCM's existing Business Rules Engine
Produces rule-based scores/flags
Disposition Recommender
Combines similarity scores, rule evaluations, and LLM reasoning
Generates confidence-scored recommendations (e.g., "Close - 95% confidence")
Can operate in:
Auto mode: Automatically applies high-confidence dispositions
Assist mode: Suggests dispositions for analyst review
4. Output & Actions
Alert Disposition Service
Updates FCM database with disposition decisions
Integrates with UnBusinessLayer managers
Handles workflow state transitions
Audit Logger
Records every decision with full reasoning trail
Stores: Alert ID, Disposition, Confidence, Similar Cases Used, Rules Applied, LLM Reasoning
Enables regulatory compliance and review
Feedback Loop
Captures analyst overrides (when agent is wrong)
Stores corrections back to Redis decision history
Enables continuous improvement
Redis Storage Architecture
Redis serves as the distributed memory system for the agent, providing fast, persistent storage for multiple data types.

Why Redis?
Speed: Sub-millisecond read/write for real-time decisions
Data Structures: Rich types (hashes, sets, sorted sets, streams)
Vector Search: Redis Stack supports vector similarity search
Persistence: AOF/RDB for durability
Scalability: Clustering for high throughput
TTL Support: Automatic expiration for session cleanup
Redis Data Stores
1. Session Store (Agent State/Context)
Data Structure: Redis Hashes

Usage Pattern:

Context Manager reads/writes here during processing
Tracks where agent is in the workflow
Enables resume after failures
Expires automatically after timeout
2. Decision History (Previous Dispositions)
Data Structure: Redis Sorted Sets + Hashes

Usage Pattern:

Similarity Matcher queries for similar past decisions
Feedback Loop writes new decisions
Learning from historical outcomes
Pattern analysis over time
3. Alert Embeddings (Vector Store)
Data Structure: Redis Vector Similarity Search (RediSearch)

Usage Pattern:

Embeddings Generator stores vectors when alerts are processed
Similarity Matcher performs vector search: FT.SEARCH alert_vectors "* => [KNN 10 @embedding $vec]"
Returns semantically similar alerts even if text differs
Example: "Large wire transfer to new account" ≈ "High-value external transfer to recent payee"
4. Criteria Cache (Business Rules/Policies)
Data Structure: Redis Hashes + Sets

Usage Pattern:

Rule Engine reads frequently accessed rules
Cache warm-up at agent startup
Invalidated when rules change in database
Reduces database load
5. Performance Metrics (Agent Analytics)
Data Structure: Redis Streams + Time Series

Usage Pattern:

Tracks agent performance in real-time
Dashboards read for monitoring
Identifies drift (accuracy degradation)
Capacity planning
